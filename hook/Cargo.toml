[package]
name = "lintel-hook"
description = "Relays agent CLI hook events to Lintel over a named pipe"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lintel-hook"
path = "src/main.rs"

[dependencies]
notch-brand = { path = "../crates/brand" }
serde_json = "1"

# Just enough Win32 to know our own SID, to check who is serving the pipe, and
# to know the processes we run under (the session's window, a parent gone).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }
