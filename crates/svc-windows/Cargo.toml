[package]
name = "svc-windows"
description = "Lintel shared service: Windows"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
notch-core = { path = "../core" }
# List the Win32 API sets this service calls; Cargo unifies them across the workspace.
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_Com",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
